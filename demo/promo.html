<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>多维表格控制助手 · 宣传图</title><style>*{box-sizing:border-box}body{margin:0;background:#291a57;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.tile{width:440px;height:280px;position:relative;overflow:hidden;padding:32px;color:white;background:radial-gradient(ellipse at 92% 5%,#7757ee 0,transparent 65%),linear-gradient(130deg,#221441,#302575)}.logo{width:94px;height:94px;background:white;border-radius:22px;box-shadow:0 12px 26px #17123066;overflow:hidden}.logo img{width:100%;height:100%}h1{font-size:24px;margin:23px 0 8px;font-weight:680;letter-spacing:0}p{font-size:14px;color:#d5c9f6;letter-spacing:2px;margin:0}.control{position:absolute;right:38px;top:41px;width:110px;height:110px;border:1px solid #ffffff3b;border-radius:50%;background:#ffffff10;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;color:#ebe5ff;font-size:17px}.ok{background:white;color:#6941ce;font-size:12px;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:700}.pill{position:absolute;right:40px;top:174px;padding:6px 11px;border:1px solid #ffffff28;border-radius:20px;color:#e4dcff;font-size:11px;letter-spacing:1px}</style></head><body><main class="tile"><div class="logo"><img src="/extension/icons/256.png"></div><div class="control"><span></span><span>↑</span><span></span><span>←</span><span class="ok">OK</span><span>→</span><span></span><span>↓</span><span></span></div><h1>多维表格控制助手</h1><p>浏览记录 · 操作字段 · 语音评论</p><div class="pill">自定义快捷键</div></main></body></html>
